name: Temporary upload release checksums

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-upload-checksums.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Upload exact release checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/SHA256SUMS.txt <<'EOF'
          e3ee14e52459a905775da1f0082ee94827575b1a5a79388972b348db69dbe2b1  ruble-core-v1.0.0rc7-win64-portable.zip
          5df0bc0800b50001858b4cd6b8f6a8bc7e4b778b637b236d2f652304cf329521  ruble-core-v1.0.0rc7-win64-setup.exe
          cddecd0e5dc94894978d7bdb35f44ef52dddc6092e37d614469c2e321c751716  ruble-core-v1.0.0rc7-linux-x86_64.tar.gz
          EOF
          sed -i 's/^          //' /tmp/SHA256SUMS.txt
          sha256sum /tmp/SHA256SUMS.txt
          gh release upload v1.0.0rc7 /tmp/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
