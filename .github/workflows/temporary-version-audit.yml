name: Temporary wallet version audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-version-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Inspect published Windows version metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:RUNNER_TEMP 'ruble-version-audit'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null

          $Base = 'https://github.com/WildBill32/ruble-core-releases/releases/download/v1.0.0rc7'
          $Zip = Join-Path $Root 'portable.zip'
          $Setup = Join-Path $Root 'setup.exe'

          Invoke-WebRequest -Uri "$Base/ruble-core-v1.0.0rc7-win64-portable.zip" -OutFile $Zip
          Invoke-WebRequest -Uri "$Base/ruble-core-v1.0.0rc7-win64-setup.exe" -OutFile $Setup

          if ((Get-FileHash -Algorithm SHA256 $Zip).Hash.ToLowerInvariant() -ne 'e3ee14e52459a905775da1f0082ee94827575b1a5a79388972b348db69dbe2b1') { throw 'Portable hash mismatch' }
          if ((Get-FileHash -Algorithm SHA256 $Setup).Hash.ToLowerInvariant() -ne '5df0bc0800b50001858b4cd6b8f6a8bc7e4b778b637b236d2f652304cf329521') { throw 'Setup hash mismatch' }

          $Out = Join-Path $Root 'portable'
          Expand-Archive -Path $Zip -DestinationPath $Out -Force
          $Qt = (Get-ChildItem $Out -Recurse -Filter ruble-qt.exe | Select-Object -First 1).FullName
          if (-not $Qt) { throw 'ruble-qt.exe not found' }

          Write-Host '===== RUBLE-QT VERSIONINFO ====='
          $qv = (Get-Item $Qt).VersionInfo
          $qv | Format-List FileDescription,ProductName,FileVersion,ProductVersion,OriginalFilename

          Write-Host '===== RUBLE-QT -version ====='
          & $Qt -version 2>&1 | ForEach-Object { Write-Host $_ }

          Write-Host '===== SETUP VERSIONINFO ====='
          $sv = (Get-Item $Setup).VersionInfo
          $sv | Format-List FileDescription,ProductName,FileVersion,ProductVersion,OriginalFilename

          Write-Host '===== ARCHIVE README ====='
          Get-ChildItem $Out -Recurse -Filter README.txt | ForEach-Object { Get-Content $_.FullName }

          Write-Host 'VERSION_AUDIT=PASS'
