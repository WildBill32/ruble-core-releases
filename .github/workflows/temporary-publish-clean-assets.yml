name: Temporary publish clean release assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-publish-clean-assets.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified clean candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/clean
          gh run download 31979904673 \
            --repo "$GITHUB_REPOSITORY" \
            --name ruble-clean-release-candidates \
            --dir /tmp/clean

          test -f /tmp/clean/ruble-core-v1.0.0rc7-win64-portable.zip
          test -f /tmp/clean/ruble-core-v1.0.0rc7-linux-x86_64.tar.gz

          echo 'e3ee14e52459a905775da1f0082ee94827575b1a5a79388972b348db69dbe2b1  /tmp/clean/ruble-core-v1.0.0rc7-win64-portable.zip' | sha256sum -c -
          echo 'cddecd0e5dc94894978d7bdb35f44ef52dddc6092e37d614469c2e321c751716  /tmp/clean/ruble-core-v1.0.0rc7-linux-x86_64.tar.gz' | sha256sum -c -

      - name: Re-verify packaged binaries and public metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/verify-win /tmp/verify-linux
          unzip -q /tmp/clean/ruble-core-v1.0.0rc7-win64-portable.zip -d /tmp/verify-win
          tar -xzf /tmp/clean/ruble-core-v1.0.0rc7-linux-x86_64.tar.gz -C /tmp/verify-linux

          WIN_EXE="$(find /tmp/verify-win -type f -name ruble-qt.exe -print -quit)"
          LIN_EXE="$(find /tmp/verify-linux -type f -path '*/bin/ruble-qt' -print -quit)"

          echo '00435a30141db9f4cabd12061ff9f0f26ed7b24f83edfad65f10effc0ad8477a  '"$WIN_EXE" | sha256sum -c -
          echo '60571868814d368edfd33d756c54664e6451708b719810495c30e6c7287e8eb9  '"$LIN_EXE" | sha256sum -c -

          unzip -Z1 /tmp/clean/ruble-core-v1.0.0rc7-win64-portable.zip > /tmp/win-list.txt
          tar -tzf /tmp/clean/ruble-core-v1.0.0rc7-linux-x86_64.tar.gz > /tmp/linux-list.txt
          find /tmp/verify-win /tmp/verify-linux -type f -name README.txt -exec cat {} \; > /tmp/readmes.txt

          if grep -Eqi '849cbf8|preactivation|source[[:space:]]+commit|AuxPoW' /tmp/win-list.txt /tmp/linux-list.txt /tmp/readmes.txt; then
            echo 'PUBLIC_SAFE_AUDIT=FAIL'
            exit 1
          fi
          echo 'PUBLIC_SAFE_AUDIT=PASS'

      - name: Replace only Portable and Linux release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload v1.0.0rc7 \
            /tmp/clean/ruble-core-v1.0.0rc7-win64-portable.zip \
            /tmp/clean/ruble-core-v1.0.0rc7-linux-x86_64.tar.gz \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          gh release view v1.0.0rc7 --repo "$GITHUB_REPOSITORY" --json assets
