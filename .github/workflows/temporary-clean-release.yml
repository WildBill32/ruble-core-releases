name: Temporary clean release packaging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repack verified release binaries with public-safe metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0rc7"
          mkdir -p work/input work/old-win work/old-linux work/clean

          curl -fL --retry 3 -o work/input/win.zip \
            "$BASE/ruble-core-v1.0.0rc7-win64-portable.zip"
          curl -fL --retry 3 -o work/input/linux.tar.gz \
            "$BASE/ruble-core-v1.0.0rc7-linux-x86_64.tar.gz"

          echo '3b5532e93bb7d214a08de67565dbdcd5c3fdab4ebf6112f769079660cfdee89f  work/input/win.zip' | sha256sum -c -
          echo '2b929ccb78651b7c05f6e309a357dcd00fac7892063661b5704205b04b324c58  work/input/linux.tar.gz' | sha256sum -c -

          unzip -q work/input/win.zip -d work/old-win
          tar -xzf work/input/linux.tar.gz -C work/old-linux

          WIN_EXE="$(find work/old-win -type f -name ruble-qt.exe -print -quit)"
          WIN_COPYING="$(find work/old-win -type f -name COPYING -print -quit)"
          LIN_EXE="$(find work/old-linux -type f -path '*/bin/ruble-qt' -print -quit)"
          LIN_COPYING="$(find work/old-linux -type f -name COPYING -print -quit)"

          test -n "$WIN_EXE" && test -n "$WIN_COPYING"
          test -n "$LIN_EXE" && test -n "$LIN_COPYING"

          WIN_DIR="work/clean/ruble-core-v1.0.0rc7-win64-portable"
          LIN_DIR="work/clean/ruble-core-v1.0.0rc7-linux-x86_64"
          mkdir -p "$WIN_DIR" "$LIN_DIR/bin"

          cp -p "$WIN_EXE" "$WIN_DIR/ruble-qt.exe"
          cp -p "$WIN_COPYING" "$WIN_DIR/COPYING"
          cp -p "$LIN_EXE" "$LIN_DIR/bin/ruble-qt"
          cp -p "$LIN_COPYING" "$LIN_DIR/COPYING"
          chmod 755 "$LIN_DIR/bin/ruble-qt"

          echo '00435a30141db9f4cabd12061ff9f0f26ed7b24f83edfad65f10effc0ad8477a  work/clean/ruble-core-v1.0.0rc7-win64-portable/ruble-qt.exe' | sha256sum -c -
          echo '60571868814d368edfd33d756c54664e6451708b719810495c30e6c7287e8eb9  work/clean/ruble-core-v1.0.0rc7-linux-x86_64/bin/ruble-qt' | sha256sum -c -

          cat > "$WIN_DIR/README.txt" <<'EOF'
          Ruble Core v1.0.0rc7
          =====================

          Official Ruble Core Windows x64 portable wallet.

          Run:
            ruble-qt.exe

          Important:
          - Back up your wallet before replacing or upgrading wallet software.
          - Download Ruble Core only from the official release repository.
          - Verify the published SHA256 checksum before use.

          Official website:
            https://rublecore.org/
          EOF

          cat > "$LIN_DIR/README.txt" <<'EOF'
          Ruble Core v1.0.0rc7
          =====================

          Official Ruble Core Linux x86_64 wallet.

          Run:
            chmod +x bin/ruble-qt
            ./bin/ruble-qt

          Important:
          - Back up your wallet before replacing or upgrading wallet software.
          - Download Ruble Core only from the official release repository.
          - Verify the published SHA256 checksum before use.

          Official website:
            https://rublecore.org/
          EOF

          (cd "$WIN_DIR" && sha256sum ruble-qt.exe README.txt COPYING > SHA256SUMS)
          (cd "$LIN_DIR" && sha256sum bin/ruble-qt README.txt COPYING > SHA256SUMS)

          (cd work/clean && zip -9 -q -r ../../ruble-core-v1.0.0rc7-win64-portable.zip ruble-core-v1.0.0rc7-win64-portable)
          (cd work/clean && tar -czf ../../ruble-core-v1.0.0rc7-linux-x86_64.tar.gz ruble-core-v1.0.0rc7-linux-x86_64)

          printf '%s  %s\n' \
            "$(sha256sum ruble-core-v1.0.0rc7-win64-portable.zip | awk '{print $1}')" \
            'ruble-core-v1.0.0rc7-win64-portable.zip' \
            "$(sha256sum ruble-core-v1.0.0rc7-linux-x86_64.tar.gz | awk '{print $1}')" \
            'ruble-core-v1.0.0rc7-linux-x86_64.tar.gz' \
            > SHA256SUMS-clean.txt

          unzip -Z1 ruble-core-v1.0.0rc7-win64-portable.zip | tee win-list.txt
          tar -tzf ruble-core-v1.0.0rc7-linux-x86_64.tar.gz | tee linux-list.txt

          if grep -Eqi '849cbf8|preactivation|source[[:space:]]+commit' win-list.txt linux-list.txt "$WIN_DIR/README.txt" "$LIN_DIR/README.txt"; then
            echo 'PUBLIC_SAFE_AUDIT=FAIL'
            exit 1
          fi

          echo 'WINDOWS_BINARY_SHA256='$(sha256sum "$WIN_DIR/ruble-qt.exe" | awk '{print $1}')
          echo 'LINUX_BINARY_SHA256='$(sha256sum "$LIN_DIR/bin/ruble-qt" | awk '{print $1}')
          cat SHA256SUMS-clean.txt
          echo 'PUBLIC_SAFE_AUDIT=PASS'

      - name: Upload clean release candidates
        uses: actions/upload-artifact@v4
        with:
          name: ruble-clean-release-candidates
          retention-days: 1
          if-no-files-found: error
          path: |
            ruble-core-v1.0.0rc7-win64-portable.zip
            ruble-core-v1.0.0rc7-linux-x86_64.tar.gz
            SHA256SUMS-clean.txt
